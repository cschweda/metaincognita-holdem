name: CI

# Runs the unit test suite (evaluator equivalence, betting, personas, side pots)
# and the exploit-probe regression gate (no degenerate hero strategy may beat the
# pro bots) on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack (yarn from packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests (includes exploit-probe engine-leak gate)
        run: yarn test
