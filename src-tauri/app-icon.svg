<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Source icon for the desktop app. Regenerate platform icons with:
       yarn tauri icon src-tauri/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="spade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.30" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS-style squircle (824x824 centred in 1024 with ~100px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Spade (24-unit glyph scaled & centred) -->
  <g transform="translate(224,236) scale(24)">
    <path d="M12 2 C 12 2 4 8.5 4 14 C 4 16.5 6 18 8 17.5
             C 9 17.25 9.7 16.6 10 15.8 C 10 17.5 9.5 19 8 21
             L 16 21 C 14.5 19 14 17.5 14 15.8
             C 14.3 16.6 15 17.25 16 17.5 C 18 18 20 16.5 20 14
             C 20 8.5 12 2 12 2 Z"
          fill="url(#spade)"/>
  </g>
</svg>
