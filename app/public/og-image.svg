<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="40%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#110d22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="felt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78593a"/>
      <stop offset="50%" stop-color="#5c3a1e"/>
      <stop offset="100%" stop-color="#3d2713"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g opacity="0.025">
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="60" y1="0" x2="60" y2="60" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="60" x2="60" y2="60" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#g)"/>
  </g>

  <!-- Table -->
  <g transform="translate(600, 360)">
    <ellipse cx="0" cy="0" rx="300" ry="150" fill="url(#rail)" stroke="#2a1a0a" stroke-width="2"/>
    <ellipse cx="0" cy="-1" rx="297" ry="148" fill="none" stroke="#8b6b4a" stroke-width="0.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="272" ry="130" fill="url(#felt)" stroke="#0d6b34" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="272" ry="130" fill="url(#glow1)" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="190" ry="82" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.15" stroke-dasharray="6 4"/>

    <!-- Community cards -->
    <g transform="translate(-90, -12)">
      <g transform="translate(0,0)" filter="url(#shadow)">
        <rect width="36" height="50" rx="3" fill="#fafaf9" stroke="#d4d4d4" stroke-width="0.5"/>
        <text x="4" y="13" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">A</text>
        <text x="18" y="35" font-family="serif" font-size="16" fill="#dc2626" text-anchor="middle">&#x2665;</text>
      </g>
      <g transform="translate(42,0)" filter="url(#shadow)">
        <rect width="36" height="50" rx="3" fill="#fafaf9" stroke="#d4d4d4" stroke-width="0.5"/>
        <text x="4" y="13" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#171717">K</text>
        <text x="18" y="35" font-family="serif" font-size="16" fill="#171717" text-anchor="middle">&#x2660;</text>
      </g>
      <g transform="translate(84,0)" filter="url(#shadow)">
        <rect width="36" height="50" rx="3" fill="#fafaf9" stroke="#d4d4d4" stroke-width="0.5"/>
        <text x="4" y="13" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Q</text>
        <text x="18" y="35" font-family="serif" font-size="16" fill="#dc2626" text-anchor="middle">&#x2666;</text>
      </g>
      <g transform="translate(126,0)" filter="url(#shadow)">
        <rect width="36" height="50" rx="3" fill="#fafaf9" stroke="#d4d4d4" stroke-width="0.5"/>
        <text x="4" y="13" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#171717">8</text>
        <text x="18" y="35" font-family="serif" font-size="16" fill="#171717" text-anchor="middle">&#x2663;</text>
      </g>
      <g transform="translate(168,0)" filter="url(#shadow)">
        <rect width="36" height="50" rx="3" fill="#fafaf9" stroke="#d4d4d4" stroke-width="0.5"/>
        <text x="4" y="13" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">J</text>
        <text x="18" y="35" font-family="serif" font-size="16" fill="#dc2626" text-anchor="middle">&#x2665;</text>
      </g>
    </g>

    <!-- Hero cards -->
    <g transform="translate(-38, 68) rotate(-6)" filter="url(#shadow)">
      <rect width="42" height="58" rx="3" fill="#fafaf9" stroke="#ccc" stroke-width="0.5"/>
      <text x="5" y="16" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#171717">A</text>
      <text x="21" y="42" font-family="serif" font-size="20" fill="#171717" text-anchor="middle">&#x2660;</text>
    </g>
    <g transform="translate(4, 66) rotate(5)" filter="url(#shadow)">
      <rect width="42" height="58" rx="3" fill="#fafaf9" stroke="#ccc" stroke-width="0.5"/>
      <text x="5" y="16" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">K</text>
      <text x="21" y="42" font-family="serif" font-size="20" fill="#dc2626" text-anchor="middle">&#x2665;</text>
    </g>

    <!-- Chips -->
    <g transform="translate(-180, 30)">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#171717" stroke="#444" stroke-width="1"/>
      <ellipse cx="0" cy="-5" rx="14" ry="8" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
      <ellipse cx="0" cy="-10" rx="14" ry="8" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
    </g>
    <g transform="translate(185, 25)">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
      <ellipse cx="0" cy="-5" rx="14" ry="8" fill="#171717" stroke="#444" stroke-width="1"/>
    </g>
    <g transform="translate(15, -48)">
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#a855f7" stroke="#7c3aed" stroke-width="1"/>
      <ellipse cx="0" cy="-4" rx="12" ry="7" fill="#a855f7" stroke="#7c3aed" stroke-width="1"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="95" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#fafafa" letter-spacing="-1">
    No Limit Hold'em Simulator
  </text>

  <!-- Accent line -->
  <rect x="420" y="112" width="360" height="3" rx="1.5" fill="url(#accentLine)" opacity="0.8"/>
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tagline -->
  <text x="600" y="146" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" letter-spacing="5">
    LEARN. PLAY. WIN.
  </text>

</svg>
