[build]
  command = "yarn generate"
  publish = "dist"

# Static files served directly (before SPA catch-all)
[[redirects]]
  from = "/sample-hands.txt"
  to = "/sample-hands.txt"
  status = 200

# SPA catch-all (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # One year; no includeSubDomains/preload on purpose — the hub's other games live on sibling hosts we don't control from here.
    Strict-Transport-Security = "max-age=31536000"
    # 'unsafe-inline' is the Vue runtime's; 'unsafe-eval' was dropped in Round 7 (the production bundle has no eval / new Function).
    # api.iconify.design stays only as a fallback for any icon name the client bundle's scan misses.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.iconify.design; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
